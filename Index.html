<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCollegeID Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card-container">
        <div class="id-card">
            <header class="card-header">
                <img class="clg-logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZHz2qeDvz25kl3rrRfxitvK6f3zYTDptkml6ubCAMCA&s " alt="College Logo">
                <p class="college-title">Osmania</p>
            </header>

            <div class="photo-wrap">
                <img class="photo" src="https://i.pinimg.com/736x/1d/f9/d4/1df9d49191b554fd08b35bc0164dae98.jpg" alt="Profile Photo">
            </div>

            <main class="card-body">
                <h2 class="student-name">Shreyanshi Shrivastav</h2>
                <p class="college-name">XYZ College</p>

                <hr class="divider">

                <div class="details">
                    <p class="course">B.Sc(MSCs)</p>
                    <p class="dob">05-01-2006</p>
                </div>

                <div class="id-line">
                    <span class="id-label">ID-NO:</span>
                    <span class="id-value">1231231231323</span>
                </div>

                <div class="barcode">
                    <span><span></span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span>
                </div>
            </main>

            <footer class="card-footer">
                <p class="footer-text">Issued by : XYZ College</p>
            </footer>
        </div>
    </div>
</body>

</html>
